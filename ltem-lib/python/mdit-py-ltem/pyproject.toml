[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mdit-py-ltem"
version = "0.1.0"
description = "markdown-it-py plugin for LTEM tables: merged cells and multi-row headers in Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sangkeun Jung" }]
keywords = ["markdown", "markdown-it", "table", "colspan", "rowspan", "ltem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["ltem-core", "markdown-it-py>=3"]

[tool.uv.sources]
ltem-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mdit_py_ltem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

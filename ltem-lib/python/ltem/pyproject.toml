[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ltem-core"
version = "0.1.0"
description = "LTEM (LLM-friendly Table-Enhanced Markdown): Markdown tables with merged cells and multi-row headers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sangkeun Jung" }]
keywords = ["markdown", "table", "colspan", "rowspan", "llm", "ltem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
markdown = ["markdown-it-py>=3"]

[project.scripts]
ltem = "ltem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ltem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

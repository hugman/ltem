[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "markdown-ltem"
version = "0.1.0"
description = "Python-Markdown extension for LTEM tables: merged cells and multi-row headers in Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EurekaAI Co., Ltd." }]
keywords = ["markdown", "python-markdown", "mkdocs", "table", "colspan", "rowspan", "ltem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["ltem-core", "markdown>=3.6"]

[project.urls]
Homepage = "https://hugman.github.io/ltem/"
Repository = "https://github.com/hugman/ltem"
Source = "https://github.com/hugman/ltem/tree/main/ltem-lib/python/markdown-ltem"
Issues = "https://github.com/hugman/ltem/issues"

[project.entry-points."markdown.extensions"]
ltem = "markdown_ltem:LtemExtension"

[tool.uv.sources]
ltem-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_ltem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

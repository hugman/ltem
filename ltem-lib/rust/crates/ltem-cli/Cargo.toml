[package]
name = "ltem-cli"
description = "Command-line tool for LTEM tables: parse, render, validate, format, convert from HTML"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["markdown", "table", "gfm", "cli"]
categories = ["command-line-utilities", "text-processing"]
# Not published to crates.io before the repository is public.
publish = false

[[bin]]
name = "ltem"
path = "src/main.rs"
doc = false

[dependencies]
ltem = { path = "../ltem", features = ["commonmark-inline"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.100"
